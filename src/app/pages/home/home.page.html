<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>BloodConnect</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToAdd()" *ngIf="isOrg">
        <ion-icon name="add-circle-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/profile">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/login" *ngIf="!isAuthenticated">
        <ion-icon name="log-in-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()" *ngIf="isAuthenticated">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Rechercher une campagne" [(ngModel)]="query"></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="filterType">
      <ion-segment-button value="all">Toutes</ion-segment-button>
      <ion-segment-button value="A+">A+</ion-segment-button>
      <ion-segment-button value="O+">O+</ion-segment-button>
      <ion-segment-button value="B+">B+</ion-segment-button>
      <ion-segment-button value="AB+">AB+</ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container card-gap" *ngIf="(filteredCampaigns()?.length || 0) > 0; else empty">
    <ion-card *ngFor="let c of filteredCampaigns()" (click)="goToDetails(c.id!)">
      <ion-card-header>
        <ion-card-title>{{ c.title }}</ion-card-title>
        <ion-card-subtitle class="muted">{{ c.date | date: 'mediumDate' }} • {{ c.location || 'Lieu à préciser' }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <span class="chip">{{ c.bloodType || 'Tous groupes' }}</span>
        <div class="muted" style="margin-top:8px">Participants: {{ c.participants?.length || 0 }}</div>
      </ion-card-content>
    </ion-card>
  </div>
  <ng-template #empty>
    <ion-text color="medium">
      <div class="empty-hint">Aucune campagne. Cliquez sur + pour ajouter.</div>
    </ion-text>
  </ng-template>
</ion-content>
